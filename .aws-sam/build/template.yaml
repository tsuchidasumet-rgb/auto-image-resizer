AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Globals:
  Function:
    Runtime: python3.12
    MemorySize: 512
    Timeout: 30
    Environment:
      Variables:
        BUCKET_NAME:
          Fn::Sub: watermark-game-${AWS::AccountId}
        USER_POOL_CLIENT_ID:
          Ref: UserPoolClient
Resources:
  GameImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: watermark-game-${AWS::AccountId}
      CorsConfiguration:
        CorsRules:
        - AllowedOrigins:
          - '*'
          AllowedMethods:
          - GET
          - PUT
          - POST
          AllowedHeaders:
          - '*'
  WatermarkFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: WatermarkFunction
      Handler: app.lambda_handler
      Policies:
      - S3ReadPolicy:
          BucketName:
            Fn::Sub: watermark-game-${AWS::AccountId}
      - S3WritePolicy:
          BucketName:
            Fn::Sub: watermark-game-${AWS::AccountId}
      Events:
        FileUpload:
          Type: S3
          Properties:
            Bucket:
              Ref: GameImageBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                - Name: prefix
                  Value: uploads/
    Metadata:
      SamResourceId: WatermarkFunction
  HttpApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: HttpApiFunction
      Handler: app.lambda_handler
      Environment:
        Variables:
          BUCKET_NAME:
            Fn::Sub: watermark-game-${AWS::AccountId}
          USER_POOL_CLIENT_ID:
            Ref: UserPoolClient
      Policies:
      - S3ReadPolicy:
          BucketName:
            Fn::Sub: watermark-game-${AWS::AccountId}
      - S3WritePolicy:
          BucketName:
            Fn::Sub: watermark-game-${AWS::AccountId}
      - Statement:
        - Effect: Allow
          Action:
          - s3:ListBucket
          Resource:
            Fn::Sub: arn:aws:s3:::watermark-game-${AWS::AccountId}
        - Effect: Allow
          Action:
          - cognito-idp:InitiateAuth
          - cognito-idp:SignUp
          - cognito-idp:ConfirmSignUp
          - cognito-idp:GetUser
          Resource:
            Fn::GetAtt:
            - UserPool
            - Arn
      Events:
        UploadUrl:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /upload
            Method: POST
        ListImages:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /images
            Method: GET
        Register:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /auth/register
            Method: POST
        Login:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /auth/login
            Method: POST
        Confirm:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /auth/confirm
            Method: POST
    Metadata:
      SamResourceId: HttpApiFunction
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowMethods:
        - GET
        - POST
        - PUT
        - OPTIONS
        AllowHeaders:
        - '*'
        MaxAge: 300
        AllowCredentials: false
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: watermark-game-users
      UsernameAttributes:
      - email
      AutoVerifiedAttributes:
      - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
      Schema:
      - Name: nickname
        AttributeDataType: String
        Mutable: true
        Required: true
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: watermark-game-client
      UserPoolId:
        Ref: UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 24
      TokenValidityUnits:
        AccessToken: hours
Outputs:
  ApiEndpoint:
    Value:
      Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
    Description: API Endpoint
  UserPoolId:
    Value:
      Ref: UserPool
    Description: Cognito User Pool ID
  UserPoolClientId:
    Value:
      Ref: UserPoolClient
    Description: Cognito Client ID
