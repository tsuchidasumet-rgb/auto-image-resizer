<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jibun Market — เข้าสู่ระบบ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --brand:#ff0211; --brand-dark:#e6000f; --brand-light:#fff0f0; --bg:#f5f5f5; --surface:#fff; --text:#222; --text-sub:#888; --border:#e8e8e8; }
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans Thai',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:20px;text-align:center}
.logo-mark{display:inline-flex;width:48px;height:48px;background:var(--brand);border-radius:10px;color:#fff;font-weight:700;font-size:14px;align-items:center;justify-content:center;margin-bottom:10px}
.logo-name{font-size:22px;font-weight:700}
.logo-tag{font-size:13px;color:var(--text-sub);margin-top:4px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 20px}
.card{background:var(--surface);border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.08);width:100%;max-width:400px;overflow:hidden}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border)}
.tab{padding:16px;text-align:center;font-size:14px;font-weight:600;color:var(--text-sub);background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;font-family:inherit}
.tab.active{color:var(--brand);border-bottom-color:var(--brand);background:var(--brand-light)}
.form{padding:28px 24px 32px}
.form h2{font-size:20px;font-weight:700;margin-bottom:6px}
.form-sub{font-size:13px;color:var(--text-sub);margin-bottom:22px;line-height:1.6}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-sub);margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:4px;font-size:15px;font-family:inherit;outline:none}
.field input:focus{border-color:var(--brand)}
.btn{width:100%;padding:14px;background:var(--brand);color:#fff;border:none;border-radius:4px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:6px}
.btn:hover:not(:disabled){background:var(--brand-dark)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.alert{padding:12px 14px;border-radius:4px;font-size:13px;margin-bottom:16px;display:none;line-height:1.5}
.alert.show{display:block}
.alert.ok{background:#e8f5e9;color:#2e7d32}
.alert.err{background:var(--brand-light);color:var(--brand)}
.otp-section{display:none}.otp-section.show{display:block}
.otp-input{letter-spacing:6px;font-size:20px;text-align:center}
.back{text-align:center;margin-top:18px;font-size:13px}
.back a{color:var(--brand);text-decoration:none;font-weight:500}
</style>
</head>
<body>
<header class="header">
  <div class="logo-mark">JM</div>
  <div class="logo-name">Jibun Market</div>
  <div class="logo-tag">ใช้อีเมลเป็นชื่อบัญชีและลายน้ำผู้ขาย</div>
</header>
<main>
  <div class="card">
    <div class="tabs">
      <button class="tab active" type="button" onclick="switchTab('login')">เข้าสู่ระบบ</button>
      <button class="tab" type="button" onclick="switchTab('register')">สมัครสมาชิก</button>
    </div>
    <div class="form" id="form-login">
      <h2>ยินดีต้อนรับ</h2>
      <p class="form-sub">เข้าสู่ระบบด้วยอีเมลของคุณ</p>
      <div class="alert" id="login-alert"></div>
      <div class="field"><label>อีเมล</label><input type="email" id="login-email" placeholder="you@example.com" autocomplete="email"></div>
      <div class="field"><label>รหัสผ่าน</label><input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="btn" id="btn-login" type="button" onclick="doLogin()">เข้าสู่ระบบ</button>
    </div>
    <div class="form" id="form-register" style="display:none">
      <h2>สมัครสมาชิก</h2>
      <p class="form-sub">ระบบจะใช้อีเมลเป็นชื่อผู้ขายบนลายน้ำอัตโนมัติ ไม่ต้องตั้งชื่อแยก</p>
      <div class="alert" id="reg-alert"></div>
      <div id="reg-step1">
        <div class="field"><label>อีเมล</label><input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email"></div>
        <div class="field"><label>รหัสผ่าน (อย่างน้อย 8 ตัว)</label><input type="password" id="reg-password" placeholder="••••••••" autocomplete="new-password"></div>
        <button class="btn" id="btn-register" type="button" onclick="doRegister()">สมัครสมาชิก</button>
      </div>
      <div id="reg-step2" class="otp-section">
        <p class="form-sub">ส่งรหัส OTP 6 หลักไปที่อีเมลแล้ว</p>
        <div class="field"><label>รหัส OTP</label><input type="text" id="otp-code" class="otp-input" placeholder="123456" maxlength="6" inputmode="numeric"></div>
        <button class="btn" type="button" onclick="doConfirm()">ยืนยันอีเมล</button>
      </div>
      <div class="back"><a href="#" onclick="switchTab('login');return false">มีบัญชีแล้ว? เข้าสู่ระบบ</a></div>
    </div>
  </div>
</main>
<script>
const API = 'https://l5sw03zchf.execute-api.ap-northeast-1.amazonaws.com';
let pendingEmail = '';
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',(tab==='login'&&i===0)||(tab==='register'&&i===1)));
  document.getElementById('form-login').style.display = tab==='login'?'block':'none';
  document.getElementById('form-register').style.display = tab==='register'?'block':'none';
}
function showAlert(id,msg,type){const el=document.getElementById(id);el.textContent=msg;el.className=`alert ${type} show`}
function setLoading(id,on,label){const b=document.getElementById(id);b.disabled=on;if(!b.dataset.label)b.dataset.label=label||b.textContent;b.textContent=on?'กำลังดำเนินการ...':b.dataset.label}
async function doLogin(){
  const email=document.getElementById('login-email').value.trim().toLowerCase();
  const password=document.getElementById('login-password').value;
  if(!email||!password)return showAlert('login-alert','กรุณากรอกข้อมูลให้ครบ','err');
  setLoading('btn-login',true,'เข้าสู่ระบบ');
  try{
    const res=await fetch(`${API}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||'เข้าสู่ระบบไม่สำเร็จ');
    localStorage.setItem('accessToken',data.accessToken);
    localStorage.setItem('refreshToken',data.refreshToken);
    localStorage.setItem('userEmail',data.email||email);
    showAlert('login-alert','เข้าสู่ระบบสำเร็จ','ok');
    setTimeout(()=>location.href='index.html',700);
  }catch(e){showAlert('login-alert',e.message,'err')}
  setLoading('btn-login',false,'เข้าสู่ระบบ');
}
async function doRegister(){
  const email=document.getElementById('reg-email').value.trim().toLowerCase();
  const password=document.getElementById('reg-password').value;
  if(!email||!password)return showAlert('reg-alert','กรุณากรอกข้อมูลให้ครบ','err');
  if(password.length<8)return showAlert('reg-alert','รหัสผ่านต้องมีอย่างน้อย 8 ตัว','err');
  setLoading('btn-register',true,'สมัครสมาชิก');
  try{
    const res=await fetch(`${API}/auth/register`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||'สมัครไม่สำเร็จ');
    pendingEmail=email;
    showAlert('reg-alert','ส่ง OTP ไปที่อีเมลแล้ว','ok');
    document.getElementById('reg-step1').style.display='none';
    document.getElementById('reg-step2').classList.add('show');
  }catch(e){showAlert('reg-alert',e.message,'err')}
  setLoading('btn-register',false,'สมัครสมาชิก');
}
async function doConfirm(){
  const code=document.getElementById('otp-code').value.trim();
  if(!code)return showAlert('reg-alert','กรุณากรอก OTP','err');
  try{
    const res=await fetch(`${API}/auth/confirm`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:pendingEmail,code})});
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||'OTP ไม่ถูกต้อง');
    showAlert('reg-alert','ยืนยันแล้ว กรุณาเข้าสู่ระบบ','ok');
    setTimeout(()=>switchTab('login'),1200);
  }catch(e){showAlert('reg-alert',e.message,'err')}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('form-login').style.display!=='none')doLogin()});
if(localStorage.getItem('accessToken'))location.href='index.html';
</script>
</body>
</html>
