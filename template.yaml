AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 512
    Timeout: 30
    Environment:
      Variables:
        BUCKET_NAME: !Sub "watermark-game-${AWS::AccountId}"
        USER_POOL_CLIENT_ID: !Ref UserPoolClient

Resources:
  GameImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "watermark-game-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [GET, PUT, POST]
            AllowedHeaders: ["*"]

  WatermarkFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: resizer/
      Handler: app.lambda_handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub "watermark-game-${AWS::AccountId}"
        - S3WritePolicy:
            BucketName: !Sub "watermark-game-${AWS::AccountId}"
      Events:
        FileUpload:
          Type: S3
          Properties:
            Bucket: !Ref GameImageBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  UserProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "jibun-user-profiles-${AWS::AccountId}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "jibun-orders-${AWS::AccountId}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
        - AttributeName: buyerEmail
          AttributeType: S
        - AttributeName: sellerEmail
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: buyer-email-index
          KeySchema:
            - AttributeName: buyerEmail
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: seller-email-index
          KeySchema:
            - AttributeName: sellerEmail
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  HttpApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: app.lambda_handler
      Environment:
        Variables:
          BUCKET_NAME: !Sub "watermark-game-${AWS::AccountId}"
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          PROFILES_TABLE: !Ref UserProfilesTable
          ORDERS_TABLE: !Ref OrdersTable
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub "watermark-game-${AWS::AccountId}"
        - S3WritePolicy:
            BucketName: !Sub "watermark-game-${AWS::AccountId}"
        - Statement:
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub "arn:aws:s3:::watermark-game-${AWS::AccountId}"
            - Effect: Allow
              Action:
                - s3:DeleteObject
              Resource: !Sub "arn:aws:s3:::watermark-game-${AWS::AccountId}/*"
            - Effect: Allow
              Action:
                - cognito-idp:InitiateAuth
                - cognito-idp:SignUp
                - cognito-idp:ConfirmSignUp
                - cognito-idp:GetUser
              Resource: !GetAtt UserPool.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt UserProfilesTable.Arn
                - !GetAtt OrdersTable.Arn
                - !Sub "${OrdersTable.Arn}/index/*"
      Events:
        UploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /upload
            Method: POST
        ListImages:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /images
            Method: GET
        DeleteImage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /images/delete
            Method: POST
        Register:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /auth/register
            Method: POST
        Login:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /auth/login
            Method: POST
        Confirm:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /auth/confirm
            Method: POST
        GetProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me/profile
            Method: GET
        PutProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me/profile
            Method: PUT
        AvatarUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me/avatar
            Method: POST
        OrdersBuying:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me/orders/buying
            Method: GET
        OrdersSelling:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me/orders/selling
            Method: GET
        BuyProduct:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /orders/buy
            Method: POST
        ConfirmOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /orders/confirm
            Method: POST

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "*"
        MaxAge: 300
        AllowCredentials: false

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: watermark-game-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
      Schema:
        - Name: nickname
          AttributeDataType: String
          Mutable: true
          Required: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: watermark-game-client
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 24
      TokenValidityUnits:
        AccessToken: hours

Outputs:
  ApiEndpoint:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
    Description: "API Endpoint"
  UserPoolId:
    Value: !Ref UserPool
    Description: "Cognito User Pool ID"
  UserPoolClientId:
    Value: !Ref UserPoolClient
    Description: "Cognito Client ID"