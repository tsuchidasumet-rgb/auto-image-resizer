AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Resources:
  # ถังเก็บรูปภาพ
  GameImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "watermark-game-${AWS::AccountId}"

  # ฟังก์ชันใส่ลายน้ำ
  WatermarkFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: resizer/
      Handler: app.lambda_handler
      Runtime: python3.12
      MemorySize: 512
      Timeout: 30
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub "watermark-game-${AWS::AccountId}"
        - S3WritePolicy:
            BucketName: !Sub "watermark-game-${AWS::AccountId}"
      Events:
        FileUpload:
          Type: S3
          Properties:
            Bucket: !Ref GameImageBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/